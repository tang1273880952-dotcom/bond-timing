<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>美元流动性监测</title><style>
:root{font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;color:#172b46;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:24px}a{color:#2864ad}header{display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-size:25px;margin:14px 0}h2{font-size:17px}.muted{color:#68788c;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:white;border:1px solid #e0e6ee;border-radius:14px;padding:18px;margin-bottom:14px}.num{font-size:25px;font-weight:700;margin:8px 0}.ok{color:#18866a}.warn{color:#ba7b15}.bad{color:#c3484a}button{background:white;border:1px solid #d7dfe9;border-radius:7px;padding:7px 12px;cursor:pointer}button[aria-pressed=true]{background:#2563a8;color:white}svg{width:100%;height:auto;display:block}.chart{overflow:hidden}svg text{font-size:11px;fill:#718096}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.status{padding:10px;border-radius:9px;background:#f3f6fa;font-size:13px}footer{font-size:12px;color:#64748b;margin:20px 0}@media(max-width:600px){.grid{grid-template-columns:1fr}.wrap{padding:12px}}</style></head><body><main class="wrap"><header><a href="./">← 返回估值仪表盘</a><button id="reload">刷新已发布数据</button></header><h1>美元流动性监测</h1><p class="muted">官方历史数据 · 数据所属日期与抓取时间分别显示 · 非实时交易信号</p><div id="health" class="status">正在读取数据…</div><section id="cards" class="grid" style="margin-top:16px"></section><section id="charts"></section><footer>资金利差=SOFR−IORB（百分点）；HY OAS为高收益债信用利差（%）；净流动性代理=美联储资产−TGA−隔夜逆回购，按周对齐，单位十亿美元。风险阈值仅为观察提示，非经回测的交易信号。来源：FRED、纽约联储数据在FRED的公开镜像。缺失数据不补造，旧值必须显示原始日期。</footer></main><script>
const defs=[["FUNDING_SPREAD","融资压力 · SOFR−IORB","百分点",true],["HY_OAS","信用风险 · HY OAS","%",true],["RESERVES","银行准备金","百万美元",false],["NET_LIQUIDITY_BN","美元净流动性代理","十亿美元",false],["VIX","市场恐慌 · VIX","",true],["GVZ","黄金波动率 · GVZ","",true]];
let data=null,years=5;
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function pct(arr,v){if(arr.length<60)return null;return Math.round(100*arr.filter(x=>x.value<=v).length/arr.length)}
function render(){
const s=data.series||{},errors=data.errors||{};document.querySelector("#health").textContent="上次检查："+(data.checked_at||"未知")+"｜失败来源："+(Object.keys(errors).join("、")||"无")+"｜部分指标可能保留旧数据";
document.querySelector("#cards").innerHTML=defs.slice(0,4).map(([k,n,u,high])=>{let a=s[k]||[],v=a.at(-1),p=v?pct(a.filter(x=>x.date>=String(+v.date.slice(0,4)-5)+v.date.slice(4)),v.value):null;return '<article class="card"><div>'+n+'</div><div class="num">'+(v?Number(v.value).toLocaleString("zh-CN",{maximumFractionDigits:2}):"暂无")+' <small>'+u+'</small></div><div class="muted">观测日：'+(v?.date||"无")+' · 历史分位：'+(p===null?"样本不足":p+"%")+'</div>'+(errors[k]||errors[k==="FUNDING_SPREAD"?"SOFR":k]?"<div class=warn>接口失败，可能为旧数据</div>":"")+'</article>'}).join("");
document.querySelector("#charts").innerHTML=defs.map(([k,n,u])=>{const a=(s[k]||[]).filter(x=>x.date>=new Date(Date.now()-years*366*86400000).toISOString().slice(0,10));return '<section class="card"><div class="top"><h2>'+n+'</h2><div>'+[3,5,10].map(y=>'<button data-years="'+y+'" aria-pressed="'+(years===y)+'">'+y+'年</button>').join("")+'</div></div><div class="chart">'+chart(a,u)+'</div><div class="muted">最新有效观测：'+(a.at(-1)?.date||"暂无")+' · '+u+' · 不同指标频率不同</div></section>'}).join("");
document.querySelectorAll("[data-years]").forEach(b=>b.onclick=()=>{years=+b.dataset.years;render()});
}
function chart(a,unit){if(a.length<2)return '<p class="muted">有效历史数据不足</p>';let v=a.map(x=>x.value),lo=Math.min(...v),hi=Math.max(...v),pad=(hi-lo)*.12||1;lo-=pad;hi+=pad;let pts=a.map((x,i)=>(48+i*840/(a.length-1)).toFixed(1)+","+(215-(x.value-lo)/(hi-lo)*185).toFixed(1)).join(" ");let ticks=[0,.25,.5,.75,1].map(t=>'<line x1="48" x2="888" y1="'+(215-t*185)+'" y2="'+(215-t*185)+'" stroke="#e7ecf2"/><text x="4" y="'+(219-t*185)+'">'+(lo+(hi-lo)*t).toFixed(1)+'</text>').join("");return '<svg viewBox="0 0 900 250" role="img" aria-label="历史数据折线图">'+ticks+'<polyline fill="none" stroke="#2873b9" stroke-width="2" points="'+pts+'"/><text x="48" y="240">'+a[0].date+'</text><text x="780" y="240">'+a.at(-1).date+'</text></svg>'}
async function load(){try{let r=await fetch("data/liquidity_latest.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);data=await r.json();render()}catch(e){document.querySelector("#health").textContent="暂未发布流动性数据："+e.message}}
document.querySelector("#reload").onclick=load;load();
</script></body></html>
