name: 管理A股持仓或观察池
description: 手机提交表单，自动同步到A股价值筛选器
title: "[A股持仓] 新增或修改"
body:
  - type: markdown
    attributes:
      value: "仅仓库所有者提交的申请会被执行。你的代码、成本、股数将公开保存到本仓库。"
  - type: dropdown
    id: action
    attributes:
      label: 操作类型
      options:
        - 新增或更新持仓
        - 加入观察池
        - 删除持仓
        - 移出观察池
    validations:
      required: true
  - type: input
    id: code
    attributes:
      label: 股票代码
      description: 6位沪深A股代码，不含交易所前缀
      placeholder: "603345"
    validations:
      required: true
  - type: input
    id: cost
    attributes:
      label: 买入成本（元/股）
      description: 新增/更新持仓时填写；观察池可留空
      placeholder: "74.70"
  - type: input
    id: shares
    attributes:
      label: 当前持仓股数
      description: 新增/更新持仓时填写当前总股数，非本次增加的数量；观察池可留空
      placeholder: "200"
  - type: textarea
    id: note
    attributes:
      label: 备注
      description: 选填；不得填写登录密码或银行卡信息
      placeholder: "例如：长期投资，不再加仓"
