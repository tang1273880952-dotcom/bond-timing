name: Cloud portfolio updates
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
concurrency:
  group: bond-timing
  cancel-in-progress: false
jobs:
  update:
    if: github.event.issue.user.login == github.repository_owner && contains(github.event.issue.title, '[A股持仓]')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify owner and apply holding change
        run: python scripts/apply_holding.py
      - name: Commit cloud holding changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add a-share/data/holdings.json
          if ! git diff --cached --quiet; then
            git commit -m "data: update A-share cloud portfolio"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Notify and close completed issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE" --body "持仓/观察池申请已同步到云端网站。打开 A股价值筛选器刷新即可查看。"
          gh issue close "$ISSUE"
