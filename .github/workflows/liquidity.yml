name: Update US liquidity data and publish
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/liquidity.yml'
      - 'scripts/update_liquidity.py'
      - 'liquidity.html'
      - 'tests/test_liquidity.py'
      - 'tests/test_liquidity_ui.cjs'
  workflow_dispatch:
  schedule:
    # Beijing 08:00 and 20:00, UTC timestamps
    - cron: '0 0,12 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: bond-timing-market-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify data units, parsing and net liquidity arithmetic
        run: python -m unittest discover -s tests -p 'test_liquidity.py'
      - name: Fetch market observations from free sources
        run: python scripts/update_liquidity.py
      - name: Check snapshot has real historical data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("data/liquidity_latest.json")
          assert p.is_file(), "Liquidity snapshot missing"
          j=json.loads(p.read_text())
          for k in ("FUNDING_SPREAD", "HY_OAS", "RESERVES", "NET_LIQUIDITY_BN"):
              obs=j["series"].get(k, [])
              assert len(obs)>=25, f"{k}: no usable history"
              print(k, len(obs), obs[-1], j["source_by_series"].get(k))
          PY
      - name: Commit new historical data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/liquidity_latest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh verified liquidity observations"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" -eq 5 ]; then exit 1; fi
              sleep 2
            done
          fi
      - name: Sync latest committed page and data
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Check liquidity JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path("liquidity.html").read_text(encoding="utf-8")
          script=html.split("<script>")[-1].split("</script>")[0]
          assert script and "function render()" in script
          Path("/tmp/liquidity-site.js").write_text(script,encoding="utf-8")
          PY
          node --check /tmp/liquidity-site.js
          node tests/test_liquidity_ui.cjs
      - name: Build Pages and ensure liquidity data is included
        run: |
          python scripts/build_pages.py /tmp/pages-site
          test -s /tmp/pages-site/liquidity.html
          test -s /tmp/pages-site/data/liquidity_latest.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: /tmp/pages-site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed HTML and liquidity JSON are reachable
        run: |
          python - <<'PY'
          import json,time,urllib.request
          base="https://tang1273880952-dotcom.github.io/bond-timing/"
          endpoints=(("liquidity.html",False),("data/liquidity_latest.json",True))
          for path,is_json in endpoints:
              last=""
              for attempt in range(10):
                  try:
                      url=base+path+"?check="+str(int(time.time()))
                      with urllib.request.urlopen(url,timeout=12) as response:
                          body=response.read()
                          assert response.status==200 and len(body)>300
                      if is_json:
                          obj=json.loads(body)
                          assert len(obj.get("series",{}).get("FUNDING_SPREAD",[]))>100
                          assert obj.get("checked_at"), "no source check timestamp"
                      else:
                          assert "美元流动性监测".encode() in body
                      print("LIVE OK:",path,"bytes:",len(body))
                      break
                  except Exception as exc:
                      last=str(exc)
                      print("Attempt",attempt+1,path,"not ready:",last,flush=True)
                      time.sleep(5)
              else:
                  raise RuntimeError("Published Pages verification failed: "+path+" "+last)
          PY
