name: Update US liquidity data
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0,12 * * *'
permissions:
  contents: write
concurrency:
  group: bond-timing-market-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch public liquidity observations
        run: python scripts/update_liquidity.py
      - name: Commit verified snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/liquidity_latest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh US liquidity snapshot"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              if [ "$attempt" -eq 5 ]; then exit 1; fi
              sleep 2
            done
          fi
