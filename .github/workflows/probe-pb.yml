name: PB source compatibility check
on:
  push:
    branches: [main]
    paths:
      - scripts/probe_pb_sources.py
      - .github/workflows/probe-pb.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - name: Check availability of public PB history
        run: python scripts/probe_pb_sources.py
