name: Refresh A-share stock screener
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ashare.yml'
      - 'scripts/update_a_share.py'
  schedule:
    - cron: '30 14,15 * * 1-5'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: ashare-data-refresh
  cancel-in-progress: false
jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements-screener.txt'
      - name: Install free data libraries
        run: python -m pip install -r requirements-screener.txt
      - name: Update stock shortlist and PB Band
        env:
          ASHARE_MAX_FINANCIAL: '35'
          ASHARE_MAX_FALLBACK: ${{ github.event_name == 'push' && '12' || '65' }}
        run: python scripts/update_a_share.py
      - name: Publish new validated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add a-share/data/snapshot.json a-share/data/status.json
          if ! git diff --cached --quiet; then
            git commit -m "data: update A-share valuations and financial checks"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
