name: Refresh A-share stock screener
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ashare.yml'
      - 'scripts/update_a_share.py'
  schedule:
    - cron: '0 12 * * 1-5' # Asia/Shanghai 20:00, weekdays
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: bond-timing
  cancel-in-progress: false
jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements-screener.txt'
      - name: Install free data libraries
        run: python -m pip install -r requirements-screener.txt
      - name: Require today's verified fast scan before scheduled deep evaluation
        if: github.event_name == 'schedule'
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          today=datetime.now(ZoneInfo("Asia/Shanghai")).date().isoformat()
          try:
              st=json.loads(Path("a-share/data/quick_status.json").read_text(encoding="utf8"))
              raw=json.loads(Path("a-share/data/quick.json").read_text(encoding="utf8"))
          except (OSError, ValueError) as exc:
              raise SystemExit("No verified same-day 19:00 fast scan: "+str(exc))
          if (st.get("success") is not True
              or str(st.get("attemptAt",""))[:10]!=today
              or str(raw.get("generatedAt",""))[:10]!=today):
              raise SystemExit("20:00 deep evaluation aborted: 19:00 fast scan is not current or failed")
          available=(raw.get("coverage") or {}).get("everQuoted",0)
          print("Verified same-day fast scan; available PE/PB records:",available)
          PY
      - name: Update stock shortlist and PB Band
        env:
          ASHARE_MAX_FINANCIAL: '35'
          ASHARE_MAX_FALLBACK: ${{ github.event_name == 'push' && '16' || '65' }}
        run: python scripts/update_a_share.py
      - name: Publish new validated data safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Keep calculated results while updating the local checkout to the latest main.
          cp a-share/data/snapshot.json /tmp/ashare-snapshot.json
          cp a-share/data/status.json /tmp/ashare-status.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/ashare-snapshot.json a-share/data/snapshot.json
          cp /tmp/ashare-status.json a-share/data/status.json
          git add a-share/data/snapshot.json a-share/data/status.json
          if ! git diff --cached --quiet; then
            git commit -m "data: update A-share valuations and financial checks"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
