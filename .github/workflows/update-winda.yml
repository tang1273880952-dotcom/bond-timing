name: Update Wind All-A valuation history
on:
  push:
    branches: [main]
    paths:
      - scripts/update_winda.py
      - .github/workflows/update-winda.yml
  workflow_dispatch:
  schedule:
    - cron: '30 11 * * 1-5'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: wind-all-a
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Verify Wind All-A model invariants
        run: python -m unittest discover -s tests -p 'test_winda_model.py'
      - name: Update genuine Wind All-A PE and ERP
        run: python scripts/update_winda.py
      - name: Commit validated source snapshot and original PE cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/winda_latest.json /tmp/winda_latest.json
          cp data/winda_status.json /tmp/winda_status.json
          cp data/winda_pe_daily.csv /tmp/winda_pe_daily.csv 2>/dev/null || true
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/winda_latest.json data/winda_latest.json
          cp /tmp/winda_status.json data/winda_status.json
          if [ -f /tmp/winda_pe_daily.csv ]; then cp /tmp/winda_pe_daily.csv data/winda_pe_daily.csv; fi
          git add data/winda_latest.json data/winda_status.json
          git add data/winda_pe_daily.csv 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "data: update genuine Wind All-A valuations"
            for try in 1 2 3 4; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then break; fi
              if [ "$try" -eq 4 ]; then exit 1; fi
              sleep 3
            done
          fi
      - name: Refresh site files from latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Check frontend and build Pages
        run: |
          node --check winda.js
          node --check valuation-nav.js
          node tests/test_winda_render.cjs
          node tests/test_valuation_nav.cjs
          python scripts/build_pages.py "$RUNNER_TEMP/site"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/site
      - id: deployment
        uses: actions/deploy-pages@v4
