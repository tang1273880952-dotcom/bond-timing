name: Temporary PB history source investigation
on:
  push:
    paths: [scripts/pb_investigate.py, .github/workflows/pb-investigate.yml]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Inspect public historical PB availability
        run: python scripts/pb_investigate.py
