name: A-share fast broad-market valuation scan
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_a_share_fast.py'
      - 'scripts/merge_a_share_quick.py'
      - 'scripts/a_share_value_model.py'
      - 'tests/test_a_share_value_model.py'
      - 'tests/test_merge_a_share_quick.py'
      - '.github/workflows/ashare-fast.yml'
  schedule:
    - cron: '0 11 * * 1-5' # Asia/Shanghai 19:00, weekdays
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: bond-timing
  cancel-in-progress: false
jobs:
  fast-market:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-screener.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-screener.txt
      - name: Check fast scan syntax
        run: |
          python -m py_compile scripts/a_share_value_model.py scripts/update_a_share_fast.py scripts/merge_a_share_quick.py
          python -m unittest discover -s tests -p "test_*.py" -v
      - name: Broad PE PB quote check, no 10-year history
        env:
          ASHARE_FAST_LIMIT: '240'
        run: python scripts/update_a_share_fast.py
      - name: Safely commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp a-share/data/quick_status.json /tmp/ashare-quick-status.json
          if [ -f a-share/data/quick.json ]; then cp a-share/data/quick.json /tmp/ashare-quick.json; fi
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/ashare-quick-status.json a-share/data/quick_status.json
          if [ -f /tmp/ashare-quick.json ]; then
            python scripts/merge_a_share_quick.py a-share/data/quick.json /tmp/ashare-quick.json /tmp/ashare-merged.json
            cp /tmp/ashare-merged.json a-share/data/quick.json
          fi
          git add a-share/data/quick_status.json
          if [ -f a-share/data/quick.json ]; then git add a-share/data/quick.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "data: A-share fast initial valuation scan"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" -eq 5 ]; then exit 1; fi
              sleep 2
            done
          fi
      - name: Sync latest committed site files
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Assemble minimal, validated Pages bundle
        run: python scripts/build_pages.py "$RUNNER_TEMP/pages-site"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages-site
      - id: deployment
        uses: actions/deploy-pages@v4
