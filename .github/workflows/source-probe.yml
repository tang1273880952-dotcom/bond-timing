name: Test free S&P breadth and HY spread source connectivity
on:
  push:
    branches: [main]
    paths:
      - 'scripts/source_probe.py'
      - '.github/workflows/source-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python scripts/source_probe.py
