name: Update scores and publish website
on:
  push:
    branches: [main]
    paths-ignore:
      - 'scripts/update_us.py'
      - '.github/workflows/update-us.yml'
      - 'data/us_latest.json'
      - 'data/us_status.json'
      - 'data/industry_cache/**'
  workflow_dispatch:
  schedule:
    - cron: '0 14,15 * * 1-5'
permissions:
  contents: write
  pages: write
  id-token: write
# Dashboard runs independently of industry-index history updates.
# Each workflow rebases its own data commits before pushing to main.
concurrency:
  group: bond-timing-dashboard
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh-history]')
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: python -m pip install -r requirements.txt
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh-history]')
      - name: Verify yield cache integrity and bounded refresh
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh-history]')
        run: python -m unittest discover -s scripts -p 'test_yield_cache.py'
      - name: Verify valuation history sampling
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh-history]')
        run: python -m unittest discover -s scripts -p 'test_history_chart.py'
      - name: Check public asset completeness and JavaScript syntax
        run: |
          python -m unittest discover -s tests -p 'test_build_pages.py'
          node --check app.js
          node --check industry.js
          node --check valuation-nav.js
          node tests/test_valuation_nav.cjs
          node tests/test_industry_render.cjs
          node tests/test_dashboard_layout.cjs
          python scripts/audit_snapshot.py
      - name: Check chart percentile order and tooltips
        run: |
          node --check history.js
          node tests/test_history_render.cjs
      - name: Verify North Exchange 50 valuation model
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh-history]')
        run: python -m unittest discover -s scripts -p 'test_bse50.py'
      - name: Check BSE50 chart syntax and regression
        run: |
          node --check bse50.js
          node tests/test_bse50_render.cjs
      - name: Verify STAR100 real-index valuation model
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh-history]')
        run: python -m unittest discover -s scripts -p 'test_star100.py'
      - name: Check STAR100 chart syntax and regression
        run: |
          node --check star100.js
          node tests/test_star100_render.cjs
      - name: Download data and calculate scores
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh-history]')
        run: python scripts/update.py
      - name: Store snapshot
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh-history]')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh scores"
            # Another workflow may update main while data is calculated.
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Data published on attempt $attempt"
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "::error::Data push failed after five attempts"
                exit 1
              fi
              sleep 2
            done
          fi
      - name: Sync latest committed site files
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Assemble minimal, validated Pages bundle
        run: python scripts/build_pages.py "$RUNNER_TEMP/pages-site"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages-site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Report real market-refresh failures
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh-history]')
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("data/status.json").read_text(encoding="utf-8"))
          if s.get("success") is not True:
              raise SystemExit("China valuation refresh failed: " + str(s.get("error","unknown")))
          print("China valuation refresh verified")
          PY