name: Update scores and publish website
on:
  push:
    branches: [main]
    paths-ignore:
      - 'a-share/data/**'
      - 'scripts/update_a_share.py'
      - 'scripts/update_a_share_fast.py'
      - 'scripts/merge_a_share_quick.py'
      - 'scripts/apply_holding.py'
      - '.github/workflows/ashare.yml'
      - '.github/workflows/ashare-fast.yml'
      - '.github/workflows/portfolio.yml'
      - 'requirements-screener.txt'
  workflow_dispatch:
  schedule:
    - cron: '0 14,15 * * 1-5'
permissions:
  contents: write
  pages: write
  id-token: write
# Dashboard refreshes should not wait on the 35-minute A-share scans.
# Each workflow rebases its own data commits before pushing to main.
concurrency:
  group: bond-timing-dashboard
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh-history]')
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: python -m pip install -r requirements.txt
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh-history]')
      - name: Verify valuation history sampling
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh-history]')
        run: python -m unittest discover -s scripts -p 'test_history_chart.py'
      - name: Check chart percentile order and tooltips
        run: |
          node --check history.js
          node tests/test_history_render.cjs
      - name: Verify North Exchange 50 valuation model
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh-history]')
        run: python -m unittest discover -s scripts -p 'test_bse50.py'
      - name: Check BSE50 chart syntax and regression
        run: |
          node --check bse50.js
          node tests/test_bse50_render.cjs
      - name: Verify STAR100 real-index valuation model
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh-history]')
        run: python -m unittest discover -s scripts -p 'test_star100.py'
      - name: Check STAR100 chart syntax and regression
        run: |
          node --check star100.js
          node tests/test_star100_render.cjs
      - name: Download data and calculate scores
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh-history]')
        run: python scripts/update.py
      - name: Store snapshot
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh-history]')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh scores"
            # Another workflow may update main while data is calculated.
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Data published on attempt $attempt"
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "::error::Data push failed after five attempts"
                exit 1
              fi
              sleep 2
            done
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4