name: Update scores and publish website
on:
  push:
    branches: [main]
    paths-ignore:
      - 'a-share/**'
      - 'scripts/update_a_share.py'
      - 'scripts/update_a_share_fast.py'
      - 'scripts/merge_a_share_quick.py'
      - 'scripts/apply_holding.py'
      - '.github/workflows/ashare.yml'
      - '.github/workflows/ashare-fast.yml'
      - '.github/workflows/portfolio.yml'
      - 'requirements-screener.txt'
  workflow_dispatch:
  schedule:
    - cron: '0 14,15 * * 1-5'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: bond-timing
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        if: github.event_name != 'push'
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: python -m pip install -r requirements.txt
        if: github.event_name != 'push'
      - name: Download data and calculate scores
        if: github.event_name != 'push'
        run: python scripts/update.py
      - name: Store snapshot
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh scores"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4