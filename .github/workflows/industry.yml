name: Update seven industry index valuation histories
on:
  push:
    branches: [main]
    paths:
      - 'scripts/update_industry.py'
      - '.github/workflows/industry.yml'
  workflow_dispatch:
  schedule:
    - cron: '20 11,15 * * 1-5' # 19:20 and 23:20 Asia/Shanghai weekdays
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: industry-index-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: python -m pip install -r requirements.txt
      - name: Verify data transformations
        run: python -m unittest discover -s tests -p 'test_industry_*.py'
      - name: Fetch verified CSI PE-TTM history for seven indices
        run: python scripts/update_industry.py
      - name: Save latest valid industry valuations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/industry_latest.json /tmp/industry_latest.json
          cp data/industry_status.json /tmp/industry_status.json
          mkdir -p /tmp/industry-cache
          cp data/industry_cache/*.csv /tmp/industry-cache/ 2>/dev/null || true
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/industry_latest.json data/industry_latest.json
          cp /tmp/industry_status.json data/industry_status.json
          mkdir -p data/industry_cache
          cp /tmp/industry-cache/*.csv data/industry_cache/ 2>/dev/null || true
          git add data/industry_latest.json data/industry_status.json data/industry_cache/
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh verified industry valuation histories"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" -eq 5 ]; then exit 1; fi
              sleep 2
            done
          fi

      - name: Sync latest dashboard and industry data
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Validate industry chart and construct site
        run: |
          node --check industry.js
          node tests/test_industry_render.cjs
          python scripts/audit_snapshot.py
          python scripts/build_pages.py "$RUNNER_TEMP/pages-site"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages-site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Report incomplete industry refresh
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("data/industry_status.json").read_text(encoding="utf-8"))
          if s.get("success") is not True or s.get("usableCount")!=7:
              raise SystemExit("Some industry index sources failed; kept old verified values: "+str(s.get("errors",{})))
          print("All seven industry valuations verified")
          PY
