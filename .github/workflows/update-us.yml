name: Update US S&P 500 score
on:
  push:
    branches: [main]
    paths:
      - 'scripts/update_us.py'
      - '.github/workflows/update-us.yml'
  workflow_dispatch:
  schedule:
    - cron: '30 0,2 * * 2-6'
permissions:
  contents: write
concurrency:
  group: us-market-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: python -m pip install -r requirements.txt
      - name: Calculate verified US market score
        run: python scripts/update_us.py
      - name: Publish data files to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/us_latest.json data/us_status.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh S&P 500 ERP [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
