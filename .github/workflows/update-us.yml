name: Update US S&P 500 score
on:
  push:
    branches: [main]
    paths:
      - 'scripts/update_us.py'
      - '.github/workflows/update-us.yml'
  workflow_dispatch:
  schedule:
    - cron: '30 0,2 * * 2-6'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: us-market-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: python -m pip install -r requirements.txt
      - name: Calculate verified US market score
        run: python scripts/update_us.py
      - name: Publish data files to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/us_status.json
          if [ -f data/us_latest.json ]; then git add data/us_latest.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh S&P 500 ERP"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" -eq 5 ]; then exit 1; fi
              sleep 2
            done
          fi

      - name: Sync latest committed site files
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Assemble minimal, validated Pages bundle
        run: python scripts/build_pages.py "$RUNNER_TEMP/pages-site"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages-site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Report verified US refresh failures
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("data/us_status.json").read_text(encoding="utf-8"))
          if s.get("success") is not True:
              raise SystemExit("US market refresh failed: " + str(s.get("error","unknown")))
          print("US refresh verified")
          PY
